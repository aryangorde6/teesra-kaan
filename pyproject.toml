[project]
name = "teesra-kaan"
version = "0.1.0"
description = "A third listener on a scam call: hears the scam start in Hindi, Marathi or English, warns you with the caller's own words, and prepares the 1930 report."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.15"
dependencies = []

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29", "websockets>=12", "httpx>=0.27"]

[project.scripts]
teesrakaan = "teesrakaan.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teesrakaan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
